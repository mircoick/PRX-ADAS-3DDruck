i2c_bus: i2c2_PB10_PB11
i2c_addr: 111

[filament_led Model_1]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 111

[filament_control Model_2]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 109

[filament_led Model_2]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 109

[filament_control Support_3]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 110

[filament_led Support_3]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 110

[filament_control Support_4]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 108

[filament_led Support_4]
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11
i2c_addr: 108

########################################
# Temperature configuration
########################################

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 85

[temperature_sensor Kraken]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor RP2040]
sensor_type: temperature_mcu
sensor_mcu: RP2040
min_temp: 0
max_temp: 100

[stm32_temp]
[temperature_sensor Filament_Raum]
sensor_type: stm32_temp
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11

[temperature_sensor Filament_Heater]
sensor_type: stm32_temp2
i2c_mcu: mcu
i2c_bus: i2c2_PB10_PB11

[temperature_sensor heizbett_heizelement]
sensor_type: Generic 3950   
sensor_pin: PA7  
min_temp: 0
max_temp: 130

[temperature_sensor Bauraum_hinten_links]
sensor_type: Generic 3950  
sensor_pin: PC5
min_temp: 0
max_temp: 130

