[include mainsail.cfg]
[respond]

########################################
# Host-MCU configuration
########################################

[mcu]
#serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_32002C001551333234383131-if00
serial: /dev/ttyAMA0
restart_method: command

[mcu RP2040]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_50443405B0B0781C-if00
serial: /dev/ttyAMA2
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

########################################
# Stepper-Motor configuration
########################################

[force_move]
enable_force_move: True

# S1
[stepper_x]
step_pin: PB9
dir_pin: !PB8
enable_pin: !PB7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC15
position_endstop: 0
position_max: 200
homing_speed: 50

[quadrature_counter x_encoder]
mcu: RP2040
pio: 0
sm: 0

# S2
[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF0
position_endstop: 0
position_max: 200
homing_speed: 50

[quadrature_counter y_encoder]
mcu: RP2040
pio: 0
sm: 1

# S3
[stepper_z]
step_pin: PE2
dir_pin: !PE1
enable_pin: !PE0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PF2
position_endstop: 0
position_max: 500

# S5
[extruder]
step_pin: PG9
dir_pin: PG10
enable_pin: !PG13
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PF6 # HE0F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
sensor_type: MAX31865
sensor_pin: PC9
spi_bus: spi3a
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2

# S6
[extruder1]
step_pin: PG11
dir_pin: !PD7
enable_pin: !PG12
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PF7 # HE1
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
sensor_type: MAX31865
sensor_pin: PA8
spi_bus: spi3a
rtd_nominal_r: 1000
rtd_reference_r: 4300
rtd_num_of_wires: 2

########################################
# printer-chamber configuration
########################################

[heater_bed]
heater_pin: PD12
sensor_type: Generic 3950
sensor_pin: PC4
min_temp: 0
max_temp: 130
control: pid
# Headbed Calibration-Prameters from G-CODE: PID_CALIBRATE HEATER=heater_bed TARGET=60
pid_Kp: 46.840
pid_Ki: 0.472
pid_Kd: 1162.810

[servo servo_motor]
pin: PG6
maximum_servo_angle: 180
minimum_pulse_width: 0.0009
maximum_pulse_width: 0.0021
initial_angle: 170

########################################
# TMC2160 configurationh
########################################

[tmc5160 stepper_x]
cs_pin: PD3
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
#diag1_pin: PC15
run_current: 2.6
sense_resistor: 0.022
stealthchop_threshold: 0

[tmc5160 stepper_y]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
#diag1_pin: PF0
run_current: 2.6
sense_resistor: 0.022
stealthchop_threshold: 0

[tmc5160 stepper_z]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
#diag1_pin: PF1
run_current: 2.8
sense_resistor: 0.022
stealthchop_threshold: 0

[tmc5160 extruder]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.075
stealthchop_threshold: 0

[tmc5160 extruder1]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.075
stealthchop_threshold: 0

