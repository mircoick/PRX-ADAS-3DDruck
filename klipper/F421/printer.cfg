#sensor_type: MAX31865
#sensor_pin: PE10
#spi_bus: spi4
#rtd_nominal_r: 100
#rtd_reference_r: 430
#rtd_num_of_wires: 2
##rtd_use_50Hz_filter: True
#min_temp: -270
#max_temp: 1500

########################################
# Fan configuration
########################################

[fan]
pin: PA0

[heater_fan fan1]
#[fan_generic Heater1]
heater: extruder
pin: PA1
heater_temp: 50.0
shutdown_speed: 0.0

[heater_fan fan2]
#[fan_generic Heater2]
heater: extruder1
pin: PA2
heater_temp: 50.0
shutdown_speed: 0.0

[fan_generic Vakuum_Pumpe_Hinten]
pin: PD15
max_power: 1.0
shutdown_speed: 0.0
off_below: 1.0
# Tachosignal-Einbindung:
tachometer_pin: ^PD10
tachometer_ppr: 2             
tachometer_poll_interval: 0.0005

[fan_generic Vakuum_Pumpe_Extruder]
pin: PF1
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.00005
hardware_pwm: False
# Tachosignal-Einbindung:
tachometer_pin: ^PF3
tachometer_ppr: 2
tachometer_poll_interval: 0.0005

[fan_generic Luftfilter]
pin: PG4
max_power: 1.0
shutdown_speed: 0.0
off_below: 1.0

[board_pins]
aliases:
    # FPC header, Aliases EXP1 & EXP2 for mini12864
    EXP1_1=PG5, EXP1_2=PG4,
    EXP1_3=PG3, EXP1_4=PG2,
    EXP1_5=PD15, EXP1_6=PD14,
    EXP1_7=PD13, EXP1_8=PD12,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PG8, EXP2_4=PE11,
    EXP2_5=PG7, EXP2_6=PE14,
    EXP2_7=PG6, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>	

########################################
# Status configuration
########################################

[output_pin Innenraum_LEDs]
pin: PG3
value: 1
shutdown_value: 0

[output_pin Door_Lock]
pin: PA3
value: 0
shutdown_value: 0

[output_pin led_rot]
pin: PE8
#tachometer_pin: PG0
value: 0
shutdown_value: 0

[output_pin led_gelb]
pin: PA5
value: 0
shutdown_value: 0

[output_pin led_gruen]
pin: PA6
#tachometer_pin: PC1
value: 0
shutdown_value: 0

[output_pin buzzer]
pin: PA4
value: 0
shutdown_value: 0

[gcode_button NOT_AUS]
pin: ^PF4
press_gcode:
  {action_emergency_stop("Not-Aus ausgelöst: Schalter wurde geschlossen.")}

[gcode_macro GEHAEUSE_STATUS]
gcode:
  {% set deckel_state = printer["gcode_button deckel"].state %}
  {% set tuer_state = printer["gcode_button tuer"].state %}
  
  # Deckel-Status ausgeben
  RESPOND MSG="Status: Deckel ist {"geschlossen" if deckel_state == "PRESSED" else "offen"}"
  
  # Tür-Status prüfen: Wenn offen, ausgeben. Wenn zu, Tür öffnen.
  {% if tuer_state == "RELEASED" %}
    RESPOND MSG="Status: Tür ist auf."
  {% else %}
    RESPOND MSG="Status: Tür ist zu. Öffne Tür..."
    SET_PIN PIN=Door_Lock VALUE=0
  {% endif %}

[gcode_button deckel]
pin: ^!PC0
press_gcode:
  RESPOND MSG="Deckel wurde geschlossen"
release_gcode:
  RESPOND MSG="Deckel wurde geöffnet"

[gcode_button tuer]
pin: ^PF10
press_gcode:
  {% set deckel_state = printer["gcode_button deckel"].state %}
  {% if deckel_state == "RELEASED" %}
    RESPOND MSG="Warnung: Die Tür wurde geschlossen, bevor der Deckel geschlossen wurde!"
	SET_PIN PIN=Door_Lock VALUE=1
	G4 P1000
	SET_PIN PIN=Door_Lock VALUE=0
  {% else %}
    RESPOND MSG="Tür wurde geschlossen"
  {% endif %}
release_gcode:
  RESPOND MSG="Tür wurde geöffnet"

[gcode_macro Tuer_oeffnen]
gcode:
	{% set tuer_state = printer["gcode_button tuer"].state %}
	{% if tuer_state == "RELEASED" %}
		RESPOND MSG="Tür ist bereits geöffnet"
  {% else %}
		SET_PIN PIN=Door_Lock VALUE=1
		G4 P1000
		SET_PIN PIN=Door_Lock VALUE=0
  	{% endif %}


