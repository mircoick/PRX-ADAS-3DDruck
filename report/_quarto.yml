format:
  pdf:
    documentclass: scrartcl
    classoption: ["titlepage=true", "listof=totoc"]
    geometry:
      - top=30mm
      - bottom=30mm
      - left=25mm
      - right=25mm
    listings: true
    #toc: true
    #lof: true
    #lot: true
    csl: https://www.zotero.org/styles/ieee
    linkcolor: black
    keep-tex: false
    toccolor: black
    link-citations: true
    citations-hover: true
    template-partials:
      - init/before-body.tex
    include-in-header:
      text: |
        \AtBeginDocument{
        \hypersetup{
          colorlinks=true,
          citecolor=black
          }
        }
        \usepackage{XCharter}
        \usepackage{float}
        \usepackage{listings}
        \usepackage{booktabs}
        \usepackage{scrlayer-scrpage}
        \pagestyle{scrheadings}
        \clearpairofpagestyles
        \KOMAoptions{headsepline=0.5pt}
        \graphicspath{{./}{init/}}
        \chead{\fontsize{14}{12}\selectfont{Abschlussbericht Praxissemester}}
        \ihead{\includegraphics[scale=0.3]{Logo_klein.pdf}}
        \ohead{\includegraphics[scale=0.01]{Airbus.png}}
        \cfoot{\pagemark}
    filters:
      - acronyms
      - _extensions/rename.lua
    
  html:
    toc: true
    toc-location: left
    comments:
      hypothesis: true
    code-line-numbers: true
    code-tools: true
    link-citations: true
    citations-hover: true
    code-block-bg: true
    code-block-border-left: "#31BAE9"
    code-fold: show
    echo: true
    filters:
      - acronyms

  #docx: default
  #gfm: default